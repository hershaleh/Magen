name: Build APK

concurrency:
  group: magen-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Works whether the project files sit at the repo root, or the project is uploaded as a ZIP
      # (any file name, e.g. "Magen (2).zip") that contains a Magen/ folder.
      - name: Locate project
        id: loc
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
            if [ -n "$ZIP" ]; then unzip -oq "$ZIP"; fi
          fi
          if [ -f settings.gradle.kts ]; then echo "dir=." >> "$GITHUB_OUTPUT"; else echo "dir=Magen" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships the Android SDK; only the licenses need accepting.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Comprehensive static + JVM validation in one Gradle invocation (shared configuration/cache).
      # Includes Android Lint for both apps, all JVM unit tests, and builds all three APKs.
      - name: Static analysis, unit tests, and APK builds
        id: validation
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          gradle :app:lintDebug :keeper:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :keeper:assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/validation.log"

      # Build the app APK independently so UI previews remain available even if JVM tests fail.
      - name: Build UI preview APK
        id: preview
        if: always() && steps.loc.outcome == 'success'
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/preview-build.log"

      - name: Upload UI preview APK
        if: always() && steps.preview.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: magen-ui-preview-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Summarize validation failures
        if: failure() && steps.validation.outcome == 'failure'
        shell: bash {0}
        run: |
          {
            echo '## Static analysis / unit test / build failures'
            echo '```'
            grep -E 'FAILED|error:|^e: |What went wrong|Execution failed|Could not|Lint found' -A3 validation.log | head -120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure() && steps.validation.outcome == 'failure'
        with:
          name: validation-reports
          if-no-files-found: warn
          path: |
            validation.log
            ${{ steps.loc.outputs.dir }}/app/build/reports/
            ${{ steps.loc.outputs.dir }}/app/build/test-results/
            ${{ steps.loc.outputs.dir }}/keeper/build/reports/
      - name: Summarize test failures
        if: failure() && steps.unit.outcome == 'failure'
        shell: bash {0}
        run: |
          {
            echo '## Unit test failures'
            echo '```'
            grep -E 'FAILED|AssertionError|Exception|^e: |What went wrong|Could not' -A3 test.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure() && steps.unit.outcome == 'failure'
        with:
          name: unit-test-reports
          path: |
            test.log
            ${{ steps.loc.outputs.dir }}/app/build/reports/tests/
            ${{ steps.loc.outputs.dir }}/app/build/test-results/

      - name: Build debug APK
        id: build
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Short, phone-friendly error summary: open the run page and read "Build errors" at the top.
      - name: Summarize errors
        if: failure() && steps.build.outcome == 'failure'
        shell: bash {0}
        run: |
          if [ -f build.log ]; then
            ERR=$( { awk '/\* What went wrong:/{f=1} f{print} /\* Try:/{if(f) exit}' build.log | head -25; echo ---; grep -E '(^e: |error:|Could not|FAILED|Exception)' build.log | head -15; echo ---; tail -15 build.log; } | sed 's/%/%25/g' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::$ERR"
          fi
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|OutOfMemory|Caused by|not found|Could not' -A2 build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure() && steps.build.outcome == 'failure'
        with:
          name: build-log
          path: build.log

      # Test APK for the emulator job. It is built here, next to the app APK, so both are signed with the same
      # fixed debug key and the emulator job installs exactly what this run produced.
      - name: Build instrumented test APK
        id: buildtest
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebugAndroidTest --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/buildtest.log"

      - uses: actions/upload-artifact@v4
        if: failure() && steps.buildtest.outcome == 'failure'
        with:
          name: buildtest-log
          path: buildtest.log

      - uses: actions/upload-artifact@v4
        with:
          name: magen-androidtest-apk
          path: |
            ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: magen-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      # Companion app that can hold Device Owner while Magen is removed or reinstalled.
      - uses: actions/upload-artifact@v4
        with:
          name: magen-keeper-debug-apk
          path: ${{ steps.loc.outputs.dir }}/keeper/build/outputs/apk/debug/keeper-debug.apk

  # UI tests on a temporary AOSP emulator, against the APK built by the job above.
  # AOSP avoids the Google Quick Search / Pixel Launcher crashes seen in the CI image.
  # Nothing here touches Device Owner or device admin, and nothing is installed on a real device.
  emulator-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: magen-androidtest-apk
          path: apks

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run UI tests on emulator
        id: emu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-emulator-tests.sh "$(find apks -name app-debug.apk | head -1)" "$(find apks -name app-debug-androidTest.apk | head -1)" emulator-output

      - name: Summarize emulator result
        if: always()
        run: |
          {
            echo '## Emulator UI tests'
            echo '```'
            grep -E '^(OK|FAILURES|Tests run)|INSTRUMENTATION_(CODE|FAILED)|test=' emulator-output/instrumentation.txt 2>/dev/null | tail -40 || echo 'no instrumentation output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-output
          if-no-files-found: warn
          path: emulator-output/

      # Convenient standalone MP4, in addition to the complete diagnostics bundle.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-ui-video
          if-no-files-found: warn
          path: emulator-output/ui-test-video.mp4
