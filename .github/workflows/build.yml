name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Works whether the project files sit at the repo root, or the project is uploaded as a ZIP
      # (any file name, e.g. "Magen (2).zip") that contains a Magen/ folder.
      - name: Locate project
        id: loc
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
            if [ -n "$ZIP" ]; then unzip -oq "$ZIP"; fi
          fi
          if [ -f settings.gradle.kts ]; then echo "dir=." >> "$GITHUB_OUTPUT"; else echo "dir=Magen" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships the Android SDK; only the licenses need accepting.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Short, phone-friendly error summary: open the run page and read "Build errors" at the top.
      - name: Summarize errors
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|OutOfMemory|Caused by|not found|Could not' -A2 build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: magen-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
